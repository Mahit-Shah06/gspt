name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RAPT ${{ github.ref_name }}"
          releaseBody: |
            ## Install

            Download **`RAPT_*_x64-setup.exe`** below (not "Source code" — that's just a raw source snapshot, not the app) and run it. It's a normal installer: Next → Next → Install. Creates a Desktop shortcut and Start Menu entry, and RAPT opens like any other Windows app from there.

            This build is unsigned (no paid code-signing certificate), so Windows SmartScreen will show an "unknown publisher" warning on first run. Click **More info → Run anyway**. Normal for a free/indie app, nothing wrong with the file.

            "Start with Windows" is off by default — turn it on from the in-app Settings if you want RAPT to launch automatically at login.
          releaseDraft: true
          prerelease: false
