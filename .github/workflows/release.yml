name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RAPT ${{ github.ref_name }}"
          releaseBody: "Windows installer below. Unsigned build — Windows SmartScreen will show an 'unknown publisher' warning on first run, that's expected for an app without a paid code-signing certificate. Click 'More info' -> 'Run anyway'."
          releaseDraft: true
          prerelease: false
